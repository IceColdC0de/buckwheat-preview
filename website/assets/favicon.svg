  <rect x="1" y="1" width="30" height="30" rx="6" stroke="#8C5835" stroke-width="1"/>
  <!-- Stem -->
  <line x1="16" y1="28" x2="16" y2="7" stroke="#8C5835" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Leaf -->
  <path d="M16 17 C10 16 6 12 9 7 C12 6 15 10 16 13 Z" fill="#8F9E8B" stroke="#EBDCB9" stroke-width="0.8"/>
