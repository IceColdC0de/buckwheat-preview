[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "buckwheat"
dynamic = ["version"]
description = "Customise (\"rice\") your Linux desktop with plain-text requests."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.77.0",
    "openai>=1.40.0",
    "pydantic>=2",
    "textual>=8",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[project.scripts]
buckwheat = "buckwheat.main:main"

[tool.hatch.version]
path = "src/buckwheat/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/buckwheat"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
mypy_path = "src"
strict = true
plugins = ["pydantic.mypy"]
